<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Lab｜專案規劃與 AI 推演</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <style>
    :root{
      --bg:#f6f7fb;--panel:#fff;--text:#1f2937;--muted:#64748b;--line:#dbe2ea;
      --primary:#4f46e5;--primary-soft:#eef2ff;--success:#059669;--warn:#b45309;--danger:#dc2626;
      --shadow:0 8px 24px rgba(15,23,42,.08);--radius:12px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--text)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .hidden{display:none!important}
    #login-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#fff;z-index:50}
    .login-card{width:min(440px,90vw);background:#111827;padding:28px;border-radius:18px;text-align:center;box-shadow:var(--shadow)}
    .login-card h1{margin:0 0 8px}.login-card p{color:#cbd5e1;line-height:1.6}
    .btn{border:1px solid var(--line);background:#fff;color:#334155;padding:8px 12px;border-radius:8px;font-weight:700}
    .btn:hover{background:#f8fafc}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
    .btn.success{background:#ecfdf5;border-color:#a7f3d0;color:#047857}.btn.warn{background:#fffbeb;border-color:#fde68a;color:#92400e}
    .btn.danger{background:#fef2f2;border-color:#fecaca;color:#b91c1c}.btn.ghost{background:transparent}
    .btn.small{padding:5px 8px;font-size:.82rem}
    .app{min-height:100vh}
    .topbar{position:sticky;top:0;z-index:20;background:#172033;color:#fff;padding:12px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.16)}
    .brand{font-weight:900;white-space:nowrap}.topbar select{min-width:240px;background:#fff;color:#111827;border:0;border-radius:8px;padding:8px}
    .topbar .spacer{flex:1}.topbar .status{font-size:.8rem;color:#cbd5e1}
    .shell{max-width:1600px;margin:0 auto;padding:18px}
    .summary-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
    .summary-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
    .summary-card .k{font-size:.76rem;color:var(--muted);font-weight:800}.summary-card .v{font-size:1.12rem;font-weight:900;margin-top:4px}
    .layout{display:grid;grid-template-columns:minmax(270px,320px) minmax(0,1fr) minmax(320px,420px);gap:14px;align-items:start}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 3px 10px rgba(15,23,42,.05);overflow:hidden}
    .panel h2,.panel h3{margin:0}.panel-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fbfcfe}
    .panel-body{padding:14px}.muted{color:var(--muted);font-size:.86rem}.tiny{font-size:.75rem;color:#94a3b8}.stack{display:flex;flex-direction:column;gap:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    label.field{display:flex;flex-direction:column;gap:5px;font-size:.78rem;font-weight:800;color:#475569}
    input[type="text"],input[type="date"],input[type="number"],select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;background:#fff;color:#1f2937;outline:none}
    input:focus,select:focus,textarea:focus{border-color:#818cf8;box-shadow:0 0 0 2px rgba(99,102,241,.09)}
    textarea{resize:vertical;min-height:90px;line-height:1.55}
    .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.meta-grid .wide{grid-column:1/-1}
    .milestone{display:grid;grid-template-columns:130px 1fr auto;gap:6px;margin-bottom:6px}
    .nav-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tab-btn{border:1px solid var(--line);background:#fff;padding:7px 10px;border-radius:8px;font-weight:800;color:#475569}.tab-btn.active{background:var(--primary-soft);border-color:#a5b4fc;color:#3730a3}
    .view{display:none}.view.active{display:block}
    .card-list{display:flex;flex-direction:column;gap:8px}.source-card,.snapshot-item,.review-item,.finding-item,.decision-item,.scenario-item{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
    .source-card h4,.scenario-card h4{margin:0 0 6px;font-size:.98rem}.pill{display:inline-block;border-radius:999px;padding:2px 7px;font-size:.7rem;font-weight:800;background:#eef2ff;color:#4338ca;margin-right:4px}.pill.free{background:#f1f5f9;color:#475569}.pill.warn{background:#fffbeb;color:#92400e}.pill.ok{background:#ecfdf5;color:#047857}.pill.danger{background:#fef2f2;color:#b91c1c}
    .source-card .meta,.scenario-card .meta{font-size:.76rem;color:#64748b;display:flex;gap:8px;flex-wrap:wrap}
    .source-card .desc{font-size:.87rem;color:#475569;margin-top:6px;white-space:pre-wrap}
    details{border-top:1px dashed #e2e8f0;margin-top:8px;padding-top:6px}summary{cursor:pointer;color:#475569;font-weight:800;font-size:.8rem}
    .template-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.template-btn{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:8px;text-align:left;color:#334155;font-weight:800}.template-btn.active{background:#eef2ff;border-color:#818cf8;color:#3730a3}
    .codebox{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;background:#0f172a;color:#e2e8f0;border-radius:10px;padding:12px;max-height:350px;overflow:auto;font-size:.8rem;line-height:1.45}
    .notice{padding:9px 10px;border-radius:8px;font-size:.82rem;line-height:1.45}.notice.info{background:#eff6ff;color:#1e40af}.notice.warn{background:#fffbeb;color:#92400e}.notice.ok{background:#ecfdf5;color:#047857}.notice.bad{background:#fef2f2;color:#991b1b}
    .scenario-card{border-left:4px solid #818cf8}.scenario-card.changed{border-left-color:#f59e0b}.scenario-card.added{border-left-color:#10b981}.scenario-card.removed{opacity:.55;border-left-color:#ef4444}
    .scenario-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.scenario-fields .wide{grid-column:1/-1}
    .diff-group{margin-bottom:12px}.diff-row{border:1px solid var(--line);border-radius:8px;padding:9px;margin:6px 0;background:#fff}.diff-row code{font-family:ui-monospace,Consolas,monospace;font-size:.78rem}
    .list-empty{padding:22px;text-align:center;color:#94a3b8;border:1px dashed #cbd5e1;border-radius:10px;background:#f8fafc}
    .section-title{font-weight:900;color:#334155;margin:14px 0 8px}.divider{height:1px;background:#e2e8f0;margin:12px 0}
    .danger-text{color:#b91c1c}.readonly{background:#f8fafc!important;color:#64748b}
    @media(max-width:1180px){.layout{grid-template-columns:280px minmax(0,1fr)}.right-panel{grid-column:1/-1}.summary-grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:760px){.topbar{flex-wrap:wrap}.topbar select{min-width:0;flex:1}.layout{grid-template-columns:1fr}.summary-grid{grid-template-columns:repeat(2,1fr)}.meta-grid,.scenario-fields{grid-template-columns:1fr}.meta-grid .wide,.scenario-fields .wide{grid-column:auto}.template-grid{grid-template-columns:1fr}.milestone{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="login-screen">
  <div class="login-card">
    <h1>🔬 Project Lab</h1>
    <p>讀取正式白板，建立 Snapshot、Review、Finding、Decision 與 Scenario。<br>這裡可以亂想，正式白板保持安靜。</p>
    <button class="btn primary" onclick="lab.login()">使用 Google 登入</button>
  </div>
</div>

<div id="app" class="app hidden">
  <div class="topbar">
    <div class="brand">🔬 Project Lab</div>
    <select id="project-select" onchange="lab.changeProject(this.value)"></select>
    <button class="btn small" onclick="lab.reloadSource()">↻ 重新讀取白板</button>
    <button class="btn small success" onclick="lab.createSnapshot()">📸 建立 Snapshot</button>
    <div class="spacer"></div>
    <div id="source-status" class="status"></div>
    <button class="btn small" onclick="lab.logout()">登出</button>
  </div>

  <div class="shell">
    <div id="summary-grid" class="summary-grid"></div>

    <div class="layout">
      <section class="panel">
        <div class="panel-head"><h3>🧭 Project</h3><span class="tiny">專案邊界與限制</span></div>
        <div class="panel-body stack">
          <div id="project-id-view" class="notice info"></div>
          <div class="meta-grid">
            <label class="field wide">專案名稱<input id="pm-name" type="text"></label>
            <label class="field wide">專案目的<textarea id="pm-goal" placeholder="為什麼要做？"></textarea></label>
            <label class="field">專案期限<input id="pm-deadline" type="date"></label>
            <label class="field">期限性質<select id="pm-deadlineType"><option value="hard">硬性期限</option><option value="target">目標日期</option><option value="none">未設定</option></select></label>
            <label class="field wide">完成定義 Definition of Done<textarea id="pm-dod" placeholder="做到什麼程度，這一階段可以算完成？"></textarea></label>
            <label class="field wide">固定限制 Constraints<textarea id="pm-constraints" placeholder="不能改、不能犧牲、必須遵守的條件"></textarea></label>
            <label class="field">下次規劃檢討日<input id="pm-reviewDate" type="date"></label>
            <label class="field">近期詳細規劃視野（天）<input id="pm-horizon" type="number" min="1" step="1"></label>
          </div>
          <div>
            <div class="section-title">里程碑</div>
            <div id="milestone-list"></div>
            <button class="btn small" onclick="lab.addMilestone()">＋ 新增里程碑</button>
          </div>
          <button class="btn primary" onclick="lab.saveProjectMeta()">儲存 Project 資料</button>
          <div class="notice warn">Project Lab 的專案資料獨立保存，不會寫回正式白板。正式卡片仍以原白板為準。</div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><h3>🧪 工作區</h3><span id="center-subtitle" class="tiny"></span></div>
        <div class="panel-body">
          <div class="nav-tabs" id="center-tabs">
            <button class="tab-btn active" data-view="source" onclick="lab.showView('source')">正式資料</button>
            <button class="tab-btn" data-view="snapshots" onclick="lab.showView('snapshots')">Snapshots</button>
            <button class="tab-btn" data-view="reviews" onclick="lab.showView('reviews')">Reviews</button>
            <button class="tab-btn" data-view="findings" onclick="lab.showView('findings')">Findings</button>
            <button class="tab-btn" data-view="decisions" onclick="lab.showView('decisions')">Decisions</button>
            <button class="tab-btn" data-view="scenarios" onclick="lab.showView('scenarios')">Scenarios</button>
          </div>
          <div id="view-source" class="view active"></div>
          <div id="view-snapshots" class="view"></div>
          <div id="view-reviews" class="view"></div>
          <div id="view-findings" class="view"></div>
          <div id="view-decisions" class="view"></div>
          <div id="view-scenarios" class="view"></div>
        </div>
      </section>

      <section class="panel right-panel">
        <div class="panel-head"><h3>🤖 AI 協作</h3><span class="tiny">先討論，再結構化</span></div>
        <div class="panel-body stack">
          <div>
            <div class="section-title" style="margin-top:0">探索／討論模板</div>
            <div id="review-template-grid" class="template-grid"></div>
          </div>
          <label class="field">這次我特別想問<textarea id="ai-custom-question" placeholder="例如：我不確定 02 要不要拆成兩張卡，但又怕切太細。"></textarea></label>
          <div class="row">
            <select id="ai-snapshot-select" style="flex:1"></select>
            <button class="btn" onclick="lab.buildReviewPrompt()">產生提問</button>
            <button class="btn" onclick="lab.copyPrompt()">複製完整提問</button>
          </div>
          <div id="prompt-preview" class="codebox">尚未產生提問。</div>
          <div class="divider"></div>
          <label class="field">貼上 AI 回覆<textarea id="ai-response" placeholder="可以貼一般文字。若是 Scenario JSON，也可以貼在這裡。"></textarea></label>
          <div class="row">
            <button class="btn success" onclick="lab.saveReview()">💬 儲存為 Review</button>
            <button class="btn" onclick="lab.tryImportScenarioFromResponse()">🧩 解析為 Scenario</button>
          </div>
          <div id="import-status"></div>
          <div class="divider"></div>
          <div class="section-title" style="margin:0">Scenario 結構化</div>
          <div class="notice info">當討論已經形成可試排方案時，再要求 AI 回傳完整 Scenario。不是每一輪對話都需要 JSON。</div>
          <button class="btn primary" onclick="lab.buildScenarioPrompt()">產生「整理為 Scenario」提示詞</button>
          <button class="btn" onclick="lab.copyScenarioSchema()">複製 Scenario JSON Schema 範例</button>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAIY9PU-bDLktkTpLSmFKRe1uepvWCKEiU",
  authDomain: "maplestoryboss.firebaseapp.com",
  projectId: "maplestoryboss",
  storageBucket: "maplestoryboss.firebasestorage.app",
  messagingSenderId: "198034430854",
  appId: "1:198034430854:web:527ffcee039e223b972a07"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const provider = new firebase.auth.GoogleAuthProvider();

const REVIEW_TEMPLATES = [
  {id:'health', label:'專案健檢', text:'檢查目前專案規劃是否存在結構缺口、互相矛盾、粒度失衡或缺少必要前置資訊。不要急著修改，先指出問題與需要補充的資訊。'},
  {id:'unknowns', label:'找未知與假設', text:'找出目前規劃中被當成事實但其實尚未驗證的假設、仍缺資料的未知、以及這些不確定性會影響哪些工項。'},
  {id:'logic', label:'檢查規劃邏輯', text:'檢查工項的前後關係、依賴、產出與驗收是否合理。特別指出「其實不能直接排程」或「需要先探索」的部分。'},
  {id:'deadline', label:'期限壓力分析', text:'以專案期限、里程碑、剩餘時間與目前工項為基礎，分析哪一些工作已經成為時間風險，哪些工作可以降規或延後，不直接替我做決定。'},
  {id:'challenge', label:'挑戰目前想法', text:'刻意站在反方檢查目前規劃，指出我可能因為既有做法、沉沒成本或過度追求完整而忽略的替代方案。請具體說明理由。'},
  {id:'premortem', label:'假設專案失敗', text:'假設到了專案期限時成果沒有達成。根據目前資料反推最可能的失敗原因，並區分：已知問題、風險、假設、未知。不要把所有小例外都列成重大風險。'},
  {id:'custom', label:'自訂問題', text:'以我的額外問題為主，使用專案資料協助分析。資訊不足時明確指出，不要自行補成事實。'}
];

const FINDING_TYPES = [
  ['assumption','❓ 假設'],['risk','⚠ 風險'],['issue','🚧 已發生問題'],['dependency','🔗 依賴'],['decision_candidate','💡 待決策事項']
];

const lab = {
  user:null,
  source:{raw:null,cards:[],nodes:[],tabs:[],loadedAt:null},
  state:{projects:{},projectNameMap:{},snapshots:[],reviews:[],findings:[],decisions:[],scenarios:[],activeProjectId:'',activeView:'source',activeTemplate:'health',lastPrompt:'',lastScenarioPrompt:''},

  login(){ auth.signInWithPopup(provider).catch(e=>alert('登入失敗：'+e.message)); },
  logout(){ auth.signOut(); },
  key(){ return `project_lab_state_${this.user?.uid || 'anon'}`; },
  now(){ return new Date().toISOString(); },
  uid(prefix){ return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2,7)}`; },
  esc(v){ return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); },
  fmt(iso){ if(!iso)return''; const d=new Date(iso); if(Number.isNaN(d.getTime()))return iso; return d.toLocaleString('zh-TW',{hour12:false}); },
  daysUntil(dateStr){ if(!dateStr)return null; const t=new Date(); t.setHours(0,0,0,0); const d=new Date(dateStr+'T00:00:00'); return Math.ceil((d-t)/86400000); },
  sourceProjectName(card){ return String(card?.project||'').trim() || '未分類'; },
  plannedMinutes(card){ if(Number.isFinite(Number(card?.plannedMinutes))) return Math.max(0,Number(card.plannedMinutes)); if(Number.isFinite(Number(card?.plannedHours))) return Math.max(0,Number(card.plannedHours)*60); return 0; },
  logMinutes(log){ if(Number.isFinite(Number(log?.minutes)))return Math.max(0,Number(log.minutes)); if(Number.isFinite(Number(log?.seconds)))return Math.max(0,Number(log.seconds)/60); if(Number.isFinite(Number(log?.hours)))return Math.max(0,Number(log.hours)*60); return 0; },
  actualMinutes(card){ return (Array.isArray(card?.workLogs)?card.workLogs:[]).reduce((s,l)=>s+this.logMinutes(l),0); },
  statusLabel(s){ return ['未開始','進行中','完成','阻塞'][Number(s)||0] || `狀態${s}`; },

  loadState(){
    try{ const raw=localStorage.getItem(this.key()); if(raw){ const d=JSON.parse(raw); this.state={...this.state,...d}; } }catch(e){console.warn(e)}
  },
  saveState(){ localStorage.setItem(this.key(),JSON.stringify(this.state)); },

  init(){
    this.loadState();
    this.renderTemplateButtons();
    this.reloadSource(false);
  },

  reloadSource(showAlert=true){
    if(!this.user)return;
    const raw=localStorage.getItem(`whiteboard_state_${this.user.uid}`);
    if(!raw){
      this.source={raw:null,cards:[],nodes:[],tabs:[],loadedAt:this.now()};
      document.getElementById('source-status').innerText='找不到白板 localStorage';
      if(showAlert) alert('找不到正式白板資料。請先在同一個網域、同一個瀏覽器登入並開啟白板。');
      this.renderAll();
      return;
    }
    try{
      const wb=JSON.parse(raw);
      const tabs=Array.isArray(wb.tabs)?wb.tabs:[];
      const cards=[]; const nodes=[];
      Object.entries(wb.workspaces||{}).forEach(([tabId,list])=>{
        const tabName=tabs.find(t=>t.id===tabId)?.name||'未知';
        (list||[]).forEach(card=>cards.push({card:structuredClone(card),tabId,tabName}));
      });
      Object.entries(wb.nodes||{}).forEach(([tabId,list])=>{
        const tabName=tabs.find(t=>t.id===tabId)?.name||'未知';
        (list||[]).forEach(node=>nodes.push({node:structuredClone(node),tabId,tabName}));
      });
      this.source={raw:wb,cards,nodes,tabs,loadedAt:this.now()};
      this.syncProjectsFromSource();
      document.getElementById('source-status').innerText=`已讀取 ${cards.length} 張卡片 · ${new Date().toLocaleTimeString('zh-TW',{hour12:false})}`;
      if(showAlert) alert(`已重新讀取正式白板：${cards.length} 張卡片。`);
    }catch(e){ alert('白板資料解析失敗：'+e.message); }
    this.renderAll();
  },

  syncProjectsFromSource(){
    const names=[...new Set(this.source.cards.map(({card})=>this.sourceProjectName(card)))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
    names.forEach(name=>{
      let pid=this.state.projectNameMap[name];
      if(!pid){
        pid=this.uid('proj');
        this.state.projectNameMap[name]=pid;
        this.state.projects[pid]={id:pid,sourceName:name,name,goal:'',deadline:'',deadlineType:'none',definitionOfDone:'',constraints:'',nextReviewDate:'',planningHorizonDays:7,milestones:[],createdAt:this.now(),updatedAt:this.now()};
      }
    });
    if(!this.state.activeProjectId || !this.state.projects[this.state.activeProjectId]){
      const firstName=names[0]; this.state.activeProjectId=firstName?this.state.projectNameMap[firstName]:'';
    }
    this.saveState();
  },

  activeProject(){ return this.state.projects[this.state.activeProjectId] || null; },
  activeSourceName(){ return this.activeProject()?.sourceName || this.activeProject()?.name || ''; },
  projectCards(){ const name=this.activeSourceName(); return this.source.cards.filter(({card})=>this.sourceProjectName(card)===name); },
  projectNodes(){ const name=this.activeSourceName(); return this.source.nodes.filter(({node})=>(String(node.project||'').trim()||'未分類')===name); },

  changeProject(pid){ this.state.activeProjectId=pid; this.saveState(); this.renderAll(); },
  showView(name){ this.state.activeView=name; this.saveState(); document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===name)); document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===`view-${name}`)); },

  renderAll(){ this.renderProjectSelect(); this.renderSummary(); this.renderProjectMeta(); this.renderSource(); this.renderSnapshots(); this.renderReviews(); this.renderFindings(); this.renderDecisions(); this.renderScenarios(); this.renderSnapshotSelect(); this.showView(this.state.activeView||'source'); },

  renderProjectSelect(){
    const el=document.getElementById('project-select'); if(!el)return;
    const list=Object.values(this.state.projects).filter(p=>this.source.cards.some(({card})=>this.sourceProjectName(card)===p.sourceName));

  scenarioDiff(s){
    const base=this.baseSnapshot(s); const baseCards=new Map((base?.payload?.cards||[]).map(x=>[x.card.id,x.card])); const current=new Map(s.cards.map(c=>[c.originId||c.id,c])); const added=[],removed=[],modified=[];
    s.cards.forEach(c=>{ if(c.isDeleted)return; if(c.isNew||!c.originId||!baseCards.has(c.originId)){added.push(c);return;} const b=baseCards.get(c.originId); const fields=['title','content','category','status','progress','dateStart','dateEnd','plannedMinutes','deliverable','acceptance','isMemo']; const changes={}; fields.forEach(f=>{const bv=f==='plannedMinutes'?this.plannedMinutes(b):(b[f]??'');const cv=f==='plannedMinutes'?this.plannedMinutes(c):(c[f]??'');if(JSON.stringify(bv)!==JSON.stringify(cv))changes[f]={from:bv,to:cv};}); if(Object.keys(changes).length)modified.push({card:c,changes}); });
    (base?.payload?.cards||[]).forEach(x=>{const c=s.cards.find(sc=>sc.originId===x.card.id);if(!c||c.isDeleted)removed.push(x.card);}); return {added,removed,modified};
  },
  renderScenarios(){ const root=document.getElementById('view-scenarios'); const list=this.projectScenarios(); if(!list.length){root.innerHTML='<div class="list-empty">尚無 Scenario。先從 Snapshot 建立一份完整候選規劃，再自由調整。</div>';return;} root.innerHTML=list.map(s=>this.renderScenario(s)).join(''); },
  renderScenario(s){ const diff=this.scenarioDiff(s); const cards=s.cards.filter(c=>!c.isDeleted); return `<div class="scenario-item"><div class="row"><input type="text" style="flex:1;font-weight:900" value="${this.esc(s.name)}" onchange="lab.updateScenario('${s.id}','name',this.value)"><select style="max-width:150px" onchange="lab.updateScenario('${s.id}','status',this.value)"><option value="draft" ${s.status==='draft'?'selected':''}>草稿</option><option value="candidate" ${s.status==='candidate'?'selected':''}>候選</option><option value="adopted" ${s.status==='adopted'?'selected':''}>決定採用</option><option value="rejected" ${s.status==='rejected'?'selected':''}>不採用</option></select></div><div class="tiny">Base: ${this.esc(s.baseSnapshotId)}｜${this.fmt(s.createdAt)}</div><label class="field" style="margin-top:8px">Scenario 說明<textarea onchange="lab.updateScenario('${s.id}','notes',this.value)">${this.esc(s.notes||'')}</textarea></label><div class="row"><button class="btn small" onclick="lab.addScenarioCard('${s.id}')">＋ 新增卡片</button><button class="btn small" onclick="lab.toggleDiff('${s.id}')">比較 Snapshot</button><button class="btn small" onclick="lab.exportScenario('${s.id}')">匯出 JSON</button><button class="btn small danger" onclick="lab.deleteEntity('scenarios','${s.id}')">刪除 Scenario</button></div><div id="diff-${s.id}" class="hidden" style="margin-top:10px">${this.renderDiff(diff)}</div><div class="section-title">候選規劃（${cards.length} 張）</div><div class="card-list">${cards.map(c=>this.renderScenarioCard(s,c,diff)).join('')}</div></div>`; },
  renderScenarioCard(s,c,diff){ const isMod=diff.modified.some(x=>x.card.id===c.id), isAdd=diff.added.some(x=>x.id===c.id); return `<div class="scenario-card ${isAdd?'added':isMod?'changed':''}"><div class="row"><span class="pill ${isAdd?'ok':'free'}">${isAdd?'新增':c.isMemo?'自由卡':'排程卡'}</span><button class="btn small danger" onclick="lab.toggleDeleteScenarioCard('${s.id}','${c.id}')">${c.isNew?'移除':'標記刪除'}</button></div><div class="scenario-fields"><label class="field wide">標題<input type="text" value="${this.esc(c.title||'')}" onchange="lab.updateScenarioCard('${s.id}','${c.id}','title',this.value)"></label><label class="field wide">內容<textarea onchange="lab.updateScenarioCard('${s.id}','${c.id}','content',this.value)">${this.esc(c.content||'')}</textarea></label><label class="field">分類<input type="text" value="${this.esc(c.category||'')}" onchange="lab.updateScenarioCard('${s.id}','${c.id}','category',this.value)"></label><label class="field">型態<select onchange="lab.updateScenarioCard('${s.id}','${c.id}','isMemo',this.value==='true')"><option value="false" ${!c.isMemo?'selected':''}>排程卡</option><option value="true" ${c.isMemo?'selected':''}>自由卡</option></select></label><label class="field">預計開始<input type="date" value="${this.esc(c.dateStart||c.dateSingle||'')}" onchange="lab.updateScenarioCard('${s.id}','${c.id}','dateStart',this.value)"></label><label class="field">預計完成<input type="date" value="${this.esc(c.dateEnd||'')}" onchange="lab.updateScenarioCard('${s.id}','${c.id}','dateEnd',this.value)"></label><label class="field">預估工時（分鐘）<input type="number" min="0" value="${this.plannedMinutes(c)}" onchange="lab.updateScenarioCard('${s.id}','${c.id}','plannedMinutes',this.value)"></label><label class="field">狀態<select onchange="lab.updateScenarioCard('${s.id}','${c.id}','status',this.value)">${[0,1,2,3].map(v=>`<option value="${v}" ${Number(c.status)===v?'selected':''}>${this.statusLabel(v)}</option>`).join('')}</select></label><label class="field wide">預期產出<textarea onchange="lab.updateScenarioCard('${s.id}','${c.id}','deliverable',this.value)">${this.esc(c.deliverable||'')}</textarea></label><label class="field wide">驗收條件<textarea onchange="lab.updateScenarioCard('${s.id}','${c.id}','acceptance',this.value)">${this.esc(c.acceptance||'')}</textarea></label></div><details><summary>歷史事實（唯讀）</summary><div class="desc">實際工時：${(this.actualMinutes(c)/60).toFixed(2)}h｜工作紀錄：${(Array.isArray(c.entries)?c.entries:[]).length} 筆。Scenario 不修改歷史事實。</div></details></div>`; },
  renderDiff(diff){ const fld={title:'標題',content:'內容',category:'分類',status:'狀態',progress:'進度',dateStart:'預計開始',dateEnd:'預計完成',plannedMinutes:'預估工時(分鐘)',deliverable:'預期產出',acceptance:'驗收條件',isMemo:'卡片型態'}; return `<div class="diff-group"><strong>＋ 新增 ${diff.added.length}</strong>${diff.added.map(c=>`<div class="diff-row">${this.esc(c.title||'未命名')}</div>`).join('')}</div><div class="diff-group"><strong>－ 移除 ${diff.removed.length}</strong>${diff.removed.map(c=>`<div class="diff-row">${this.esc(c.title||'未命名')}</div>`).join('')}</div><div class="diff-group"><strong>✏️ 修改 ${diff.modified.length}</strong>${diff.modified.map(m=>`<div class="diff-row"><strong>${this.esc(m.card.title||'未命名')}</strong>${Object.entries(m.changes).map(([k,v])=>`<div><code>${this.esc(fld[k]||k)}</code>：${this.esc(v.from)} → ${this.esc(v.to)}</div>`).join('')}</div>`).join('')}</div>`; },
  toggleDiff(id){document.getElementById(`diff-${id}`)?.classList.toggle('hidden');},

  scenarioSchemaExample(){ return {schemaVersion:'1.0',type:'project_lab_scenario',projectId:this.state.activeProjectId,baseSnapshotId:'請填入提示詞提供的 Snapshot ID',scenario:{name:'方案名稱',notes:'此方案的核心取捨',cards:[{id:'既有卡片請保留原 card id；新增卡片用 temp_001',originId:'既有卡片填原 card id；新增卡片留空',isNew:false,isDeleted:false,title:'',content:'',category:'',status:0,progress:null,isMemo:false,dateMode:'range',dateStart:'YYYY-MM-DD',dateEnd:'YYYY-MM-DD',plannedMinutes:120,deliverable:'',acceptance:'',workLogs:[],entries:[]}]}}; },
  buildScenarioPrompt(){ const ctx=this.selectedContext(); const findings=this.projectFindings().filter(x=>x.status!=='closed'&&x.status!=='ignored'); const decisions=this.projectDecisions().filter(x=>x.status==='accepted'||x.status==='proposed'); const reviews=this.projectReviews().slice(0,5).map(r=>({template:r.templateLabel,question:r.customQuestion,response:r.response,userReflection:r.userReflection})); const prompt=`請把目前已形成的討論共識整理成一份「完整可推演 Scenario」。\n\n重要：這不是要求你重新分析，而是把已有討論轉成一個可實際試排的完整候選專案版本。若仍存在未解決且會影響結構的未知，請不要硬做 Scenario，改以文字列出還缺什麼。\n\n【規則】\n1. 回傳完整 Scenario，不只回傳變動 Delta。\n2. 既有卡片保留原 card id 與 originId。新增卡片使用 temp_001、temp_002...，originId 留空，isNew=true。\n3. 若某既有卡片要移除，保留卡片並設 isDeleted=true。\n4. 不得改寫 workLogs、entries 等歷史事實；它們請原樣保留。\n5. 只能使用以下 JSON 結構。請只輸出 JSON，不要 Markdown code fence。\n6. projectId 必須為 ${this.state.activeProjectId}。\n7. baseSnapshotId 必須為 ${ctx.id}。\n\n【JSON Schema 範例】\n${JSON.stringify(this.scenarioSchemaExample(),null,2)}\n\n【目前專案資料】\n${JSON.stringify(this.compactContext(ctx.payload),null,2)}\n\n【目前 Findings】\n${JSON.stringify(findings,null,2)}\n\n【目前 Decisions】\n${JSON.stringify(decisions,null,2)}\n\n【近期 Reviews】\n${JSON.stringify(reviews,null,2)}`; this.state.lastScenarioPrompt=prompt; this.state.lastPrompt=prompt; this.saveState(); document.getElementById('prompt-preview').innerText=prompt; return prompt; },
  copyScenarioSchema(){ this.copyText(JSON.stringify(this.scenarioSchemaExample(),null,2),'已複製 Scenario JSON 範例。'); },

  extractJson(text){ const t=String(text||'').trim(); if(!t)throw new Error('內容是空的'); const fenced=t.match(/```(?:json)?\s*([\s\S]*?)```/i); return JSON.parse(fenced?fenced[1].trim():t); },
  validateScenarioImport(obj){ const errs=[]; if(obj?.schemaVersion!=='1.0')errs.push('schemaVersion 必須是 1.0'); if(obj?.type!=='project_lab_scenario')errs.push('type 必須是 project_lab_scenario'); if(obj?.projectId!==this.state.activeProjectId)errs.push('projectId 與目前專案不一致'); if(!obj?.baseSnapshotId)errs.push('缺少 baseSnapshotId'); if(!obj?.scenario||!Array.isArray(obj.scenario.cards))errs.push('缺少 scenario.cards'); const base=obj?.baseSnapshotId==='current'?null:this.state.snapshots.find(x=>x.id===obj?.baseSnapshotId); if(obj?.baseSnapshotId!=='current'&&!base)errs.push('找不到 baseSnapshotId 對應的 Snapshot'); const baseIds=new Set((base?.payload?.cards||[]).map(x=>x.card.id)); (obj?.scenario?.cards||[]).forEach((c,i)=>{ if(!c.id)errs.push(`cards[${i}] 缺少 id`); if(c.isNew){if(!String(c.id).startsWith('temp_'))errs.push(`cards[${i}] 新卡 id 應使用 temp_ 前綴`);} else if(c.originId && base && !baseIds.has(c.originId))errs.push(`cards[${i}] originId 不存在於基準 Snapshot`); }); return errs; },
  tryImportScenarioFromResponse(){ const box=document.getElementById('import-status'); try{ const obj=this.extractJson(document.getElementById('ai-response').value); const errs=this.validateScenarioImport(obj); if(errs.length){ box.innerHTML=`<div class="notice bad"><strong>格式尚不能匯入：</strong><br>${errs.map(e=>'• '+this.esc(e)).join('<br>')}<br><button class="btn small" style="margin-top:8px" onclick="lab.copyRepairPrompt()">複製修復提示詞</button></div>`; return; } const s={id:this.uid('scenario'),projectId:obj.projectId,baseSnapshotId:obj.baseSnapshotId,name:obj.scenario.name||'AI Scenario',status:'candidate',createdAt:this.now(),updatedAt:this.now(),cards:obj.scenario.cards.map(c=>structuredClone(c)),notes:obj.scenario.notes||''}; this.state.scenarios.push(s); this.saveState(); box.innerHTML='<div class="notice ok">Scenario JSON 驗證通過並已匯入。</div>'; this.renderScenarios(); this.showView('scenarios'); }catch(e){ box.innerHTML=`<div class="notice bad"><strong>JSON 解析失敗：</strong>${this.esc(e.message)}<br><button class="btn small" style="margin-top:8px" onclick="lab.copyRepairPrompt()">複製修復提示詞</button></div>`; } },
  copyRepairPrompt(){ const example=JSON.stringify(this.scenarioSchemaExample(),null,2); const txt=`你剛才回傳的內容無法被我的 Project Lab 匯入。請不要改變方案內容，只修復格式，並只回傳合法 JSON，不要加 Markdown code fence 或說明文字。\n\n必須符合以下範例結構：\n${example}`; this.copyText(txt,'已複製修復提示詞。'); },
  exportScenario(id){ const s=this.state.scenarios.find(x=>x.id===id); if(!s)return; const obj={schemaVersion:'1.0',type:'project_lab_scenario',projectId:s.projectId,baseSnapshotId:s.baseSnapshotId,scenario:{name:s.name,notes:s.notes,cards:s.cards}}; const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'}); const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${(s.name||'scenario').replace(/[\\/:*?"<>|]/g,'_')}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href); },

  deleteEntity(key,id){ if(!confirm('確定刪除？'))return; this.state[key]=this.state[key].filter(x=>x.id!==id); this.saveState(); this.renderAll(); }
};

auth.onAuthStateChanged(user=>{
  if(user){ lab.user=user; document.getElementById('login-screen').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); lab.init(); }
  else{ lab.user=null; document.getElementById('login-screen').classList.remove('hidden'); document.getElementById('app').classList.add('hidden'); }
});
</script>
